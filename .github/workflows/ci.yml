name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install pytest
      - run: python -m pytest tests/ -q
      # YQ-1154 T1 机闸挂载（G2 PII parity / G5 CONTRIBUTING 双用途；全量套已含，显式列出防窄化）
      - run: python -m pytest tests/test_pii_parity.py tests/test_contributing_feedback.py -q
