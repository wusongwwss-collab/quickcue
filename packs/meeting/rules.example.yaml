# ==================================================================
# QuickCue 会议包 · 闸参数与判据面示例（rules.example.yaml）
# ------------------------------------------------------------------
# 用途说明：本文件是「展示性示例」，演示 QuickCue 闸参数与判据词表的全量
#   可配置面；当前发行版引擎（core/py/quickcue_engine.py）尚未接入本文件
#   的自动加载（规则包加载属后续版本能力），修改本文件暂不改变引擎行为。
# 字段口径：默认取值与引擎内置常量逐字一致，可作为对照基准。
# ==================================================================

# ---- 三层闸参数（单位：秒 / 个）----
global_cooldown_sec: 60        # 任意快提示全局冷却：两张卡之间至少间隔的秒数
same_type_cooldown_sec: 180    # 同型冷却：同类型（question）两张卡至少间隔的秒数
max_per_meeting: 12            # 场均上限：一场会议内最多出卡张数

# ---- L0 判据词表 ----
customer_role: "客户"           # 只对该角色发言触发判定（对方发言口径）
question_words:                # 疑问词表：任一词以子串命中即判疑问
  - "？"
  - "?"
  - "吗"
  - "呢"
  - "怎样"
  - "如何"
  - "是否"
  - "什么"
  - "为什么"
  - "能不能"
  - "可不可以"
complete_ends:                 # 结束标点：句尾命中判完整
  - "。"
  - "？"
  - "！"
  - "…"
  - "……"
  - "”"
  - "」"
  - "?"
  - "!"
incomplete_ends:               # 未完词结尾：句尾命中判不完整（不触发）
  - "但是"
  - "然后"
  - "因为"
  - "所以"
  - "如果"
  - "就是"
  - "还有"
  - "以及"
  - "那么"
  - "再说"
  - "比如说"
  - "比如"
  - "的话"
  - "接着"
  - "后来"
  - "后面"
  - "下一步"
  - "一方面"

# ---- L1 疑问强度（负例抑制）----
l1_min_strength: 2             # 强度阈值：问号/句末语气词=+2（单项过）；
                               # 强疑问词/开口语=+1（需两两叠加才过）
strong_words:                  # 词证（+1）：动词性疑问结构
  - "怎样"
  - "如何"
  - "为什么"
  - "能不能"
  - "可不可以"
  - "是否"
openers:                       # 词证（+1）：开口即问
  - "请问"
  - "麻烦问一下"
  - "问一下"
  - "咨询一下"

# ---- 卡面话术模板（headline 由模板池按画像选择；下行帧不携带画像原文）----
templates:
  default:                     # 画像缺省/全空时的默认模板
    headline: "客户问题速答（历史话术参考）"
  sales:                       # 画像含 销售/商务/客户成功
    headline: "客户提问 · 商务口径速答"
  consultative:                # 画像含 顾问/咨询/问诊
    headline: "客户提问 · 顾问式应答"
  technical:                   # 画像含 技术/研发/架构
    headline: "客户提问 · 技术口径速答"
  phrased:                     # 有口径示例但无行业命中
    headline: "客户提问速答（贴合我的口径）"

# ---- 卡面固定参数 ----
card_confidence: 0.75          # 知识库直出卡固定置信度
expires_in_sec: 10             # 卡片有效期（秒），超时前端自动收起
script_max_chars: 300          # 首条话术截断长度
followup_max_chars: 200        # 追加话术截断长度

# ---- 用户画像 banned 示例（仅演示字段形状；画像由宿主侧注入引擎）----
# banned 为分号/换行分隔的子串黑名单（大小写不敏感），命中的知识库候选
# 直接弃用、取下一条，不做现场改写。示例：
# banned_example: "竞品;绝对保证;低价"
